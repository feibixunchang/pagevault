# 在 server/ 目录下直接起（等价于仓库根目录那份 compose）
#   cd server && docker compose up -d --build
# 注意 context 是上一层：镜像需要同时拿到 server/ 和 extension/
services:
  pagevault:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: pagevault/server:1.5.5
    container_name: pagevault
    restart: unless-stopped
    ports:
      - "8731:8731"
    environment:
      TZ: Asia/Shanghai
      PORT: "8731"
      PUID: "1000"
      PGID: "1000"
      # 容器里看不到宿主 IP，填上宿主局域网地址，「本机地址」才不会显示成 172.x
      # PAGEVAULT_PUBLIC_ADDR: "192.168.1.10"
    volumes:
      # 数据落在 server/data（删容器不丢）
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8731/api/status',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
